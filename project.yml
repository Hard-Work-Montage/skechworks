name: Sketchyworks
options:
  bundleIdPrefix: com.sketchyworks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  # Same sources SPM builds for the CLI, wrapped as a framework so the app can
  # `import SketchyworksCore` exactly like the CLI does. One implementation, two
  # front ends — the renderer must never fork.
  SketchyworksCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SketchyworksCore
      # zstd travels inside the framework rather than as a target of its own.
      # SwiftPM builds it as a separate C module; Xcode compiles the same C into
      # this framework and reaches it through the bridging header below, so both
      # front ends get one copy of one decompressor.
      - path: Sources/CZstd
        excludes:
          - "include/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sketchyworks.SketchyworksCore
        SWIFT_VERSION: "6.0"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/CZstd/lib $(SRCROOT)/Sources/CZstd/lib/common $(SRCROOT)/Sources/CZstd/include"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) ZSTD_DISABLE_ASM=1"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Sources/CZstd/include"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES

  Sketchyworks:
    type: application
    platform: macOS
    sources:
      - path: App/Sketchyworks
        excludes:
          - "Icons/**"
      # Blue-folder-free: the colourways ship as flat resources so
      # Bundle.main.url(forResource:) finds them by name.
      - path: App/Sketchyworks/Icons
        buildPhase: resources
    dependencies:
      - target: SketchyworksCore
        embed: true
    info:
      path: App/Sketchyworks/Info.plist
      properties:
        CFBundleDisplayName: Sketchyworks
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.1.38"
        CFBundleVersion: "40"
        LSApplicationCategoryType: public.app-category.graphics-design
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
        # Our own type, declared as a *compound* extension. LaunchServices matches the
        # longest extension it knows, so `foo.sw.png` resolves to us while a plain
        # `foo.png` still belongs to Preview. Conforming to public.png is what keeps
        # Finder thumbnails and Quick Look working for free.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sketchyworks.document
            UTTypeDescription: Sketchyworks Document
            UTTypeConformsTo:
              - public.png
            UTTypeTagSpecification:
              public.filename-extension:
                - sw
                - sw.png
        # The type the app declared while it was Accomplice. Imported rather
        # than exported now, so files that never got renamed keep opening here.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.accomplice.document
            UTTypeDescription: Accomplice Document
            UTTypeConformsTo:
              - public.png
            UTTypeTagSpecification:
              public.filename-extension:
                - acmplc
                - acmplc.png
        # One Sketchyworks, ever. Opening a picture from Finder started a second
        # copy alongside the one already running, which then had its own
        # windows, its own recovery snapshots and its own idea of what was
        # unsaved.
        LSMultipleInstancesProhibited: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sketchyworks Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.sketchyworks.document
              - com.accomplice.document
          - CFBundleTypeName: SVG Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.svg-image
          # Plain pictures: we can open one — it arrives as a bitmap layer in a
          # fresh document — but Preview stays the default for all of them.
          - CFBundleTypeName: PNG Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.png
          - CFBundleTypeName: JPEG Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.jpeg
          - CFBundleTypeName: Sketch Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - sketch
          - CFBundleTypeName: Figma Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - fig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sketchyworks.Sketchyworks
        MARKETING_VERSION: "0.1.38"
        SWIFT_VERSION: "6.0"
        # Required by Developer ID signing (and by notarization later). bin/build
        # re-signs the whole bundle afterwards with one identity, which is what keeps
        # the embedded framework loadable.
        ENABLE_HARDENED_RUNTIME: YES
        # New-style .icon bundle (macOS 26 Tahoe) — compiled by actool into
        # Assets.car + CFBundleIconName, while AppIcon.icns keeps pre-Tahoe.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEAD_CODE_STRIPPING: YES

  # The app layer had no tests at all — DocumentStore and the canvas between them are
  # 2,300 lines, and that is where nearly every bug found in use has lived. A unit-test
  # bundle hosted by the app can reach them with @testable import.
  SketchyworksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SketchyworksAppTests
    dependencies:
      - target: Sketchyworks
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

  # Drives the real app through the accessibility tree. This is the only kind of test
  # that catches "clicking a layer row does nothing" — which is exactly what happened
  # when .onDrag was attached to a List row and silently ate the tap.
  SketchyworksUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/SketchyworksUITests
    dependencies:
      - target: Sketchyworks
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        TEST_TARGET_NAME: Sketchyworks

schemes:
  Sketchyworks:
    build:
      targets:
        Sketchyworks: all
        SketchyworksTests: [test]
        SketchyworksUITests: [test]
    test:
      targets:
        - SketchyworksTests
        - SketchyworksUITests
    run:
      config: Debug
