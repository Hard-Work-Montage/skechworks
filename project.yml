name: Accomplice
options:
  bundleIdPrefix: com.accomplice
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  # Same sources SPM builds for the CLI, wrapped as a framework so the app can
  # `import AccompliceCore` exactly like the CLI does. One implementation, two
  # front ends — the renderer must never fork.
  AccompliceCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AccompliceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.accomplice.AccompliceCore
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES

  Accomplice:
    type: application
    platform: macOS
    sources:
      - path: App/Accomplice
        excludes:
          - "Icons/**"
      # Blue-folder-free: the colourways ship as flat resources so
      # Bundle.main.url(forResource:) finds them by name.
      - path: App/Accomplice/Icons
        buildPhase: resources
    dependencies:
      - target: AccompliceCore
        embed: true
    info:
      path: App/Accomplice/Info.plist
      properties:
        CFBundleDisplayName: Accomplice
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.4"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.graphics-design
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
        # Our own type, declared as a *compound* extension. LaunchServices matches the
        # longest extension it knows, so `foo.acmplc.png` resolves to us while a plain
        # `foo.png` still belongs to Preview. Conforming to public.png is what keeps
        # Finder thumbnails and Quick Look working for free.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.accomplice.document
            UTTypeDescription: Accomplice Document
            UTTypeConformsTo:
              - public.png
            UTTypeTagSpecification:
              public.filename-extension:
                - acmplc
                - acmplc.png
        CFBundleDocumentTypes:
          - CFBundleTypeName: Accomplice Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.accomplice.document
          - CFBundleTypeName: SVG Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.svg-image
          # Plain PNGs: we can open them, but Preview stays the default.
          - CFBundleTypeName: PNG Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.png
          - CFBundleTypeName: Sketch Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - sketch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.accomplice.Accomplice
        MARKETING_VERSION: "0.4"
        SWIFT_VERSION: "6.0"
        # Required by Developer ID signing (and by notarization later). bin/build
        # re-signs the whole bundle afterwards with one identity, which is what keeps
        # the embedded framework loadable.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEAD_CODE_STRIPPING: YES

  # The app layer had no tests at all — DocumentStore and the canvas between them are
  # 2,300 lines, and that is where nearly every bug found in use has lived. A unit-test
  # bundle hosted by the app can reach them with @testable import.
  AccompliceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AccompliceAppTests
    dependencies:
      - target: Accomplice
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

  # Drives the real app through the accessibility tree. This is the only kind of test
  # that catches "clicking a layer row does nothing" — which is exactly what happened
  # when .onDrag was attached to a List row and silently ate the tap.
  AccompliceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/AccompliceUITests
    dependencies:
      - target: Accomplice
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        TEST_TARGET_NAME: Accomplice

schemes:
  Accomplice:
    build:
      targets:
        Accomplice: all
        AccompliceTests: [test]
        AccompliceUITests: [test]
    test:
      targets:
        - AccompliceTests
        - AccompliceUITests
    run:
      config: Debug
